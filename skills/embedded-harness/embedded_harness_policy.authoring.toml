merge_policy = "Never merge an exact-anchor query into semantic expansion. Keep one reserved result path per exact anchor; canonicalize and deduplicate candidates, fuse heterogeneous ranked lists only as a ranking aid, rerank against the original task, and preserve provenance."
fallback_rule = "If a checked surface is weak, empty, conflicting, unavailable, or loses an exact anchor, keep the original query and anchor query, then use the matching source-native search or known direct URL before broadening semantic variants."
negative_claim_rule = "A provider, index, Top-K, snippet, or AI-search miss is only not_found_in_checked_sources or retrieval_inconclusive, never proof of absence. verified_absent requires a complete closed-world source, an authority's direct negative statement, or a verifiable known-address not-found result."
coverage_rule = "Stop only when every required exact anchor is bound to a planned query and verified at a matching primary source, and every distinct required facet is supported or explicitly unresolved. In multi-entity tasks, each facet is first linked to the anchor in its local clause; ambiguous associations retain semantic_review_required. A source route must be registered and allowed by the linked target; routes without a mechanically known canonical URL require an explicit verified-for-target authority binding. Current or revision-sensitive claims require a timezone-aware checked-at value, a positive claim-specific freshness window, and a stated freshness basis, and unresolved source conflict prevents completion. Snippets and ranking scores locate candidates but are not final evidence."
cost_rule = "Execute the original query and each exact anchor independently. Use a small first wave, then expand only for an unresolved anchor, distinct facet, weak evidence, conflict, or unavailable source; do not impose a hard source or query cap that drops required coverage."
external_memory_boundary = "External candidates and source ledgers are task-local evidence. They do not enter durable memory unless a separately governed memory-write event is authorized."
source_capability_rule = "Choose source-native routes from typed anchors and explicit source context. A provider hint is a route candidate, not proof of ownership or existence; verify the canonical source before completing the facet."
unknown_source_rule = "For an untyped namespace or named entity, run capability/source discovery and retain semantic_review_required. Do not silently reinterpret it as GitHub, Hugging Face, a package registry, or an official site."
currentness_evidence_rule = "For a current or revision-sensitive claim, checked_at must be a timezone-aware ISO-8601 timestamp, must not be beyond the configured future-skew tolerance, and must fall inside the positive claim-specific freshness_window_seconds declared with a non-empty freshness_basis. The declared window cannot exceed the contract's task-local maximum, and the caller remains responsible for choosing a stricter window appropriate to the volatility of the claim; otherwise retain semantic_review_required."
source_refs = [
