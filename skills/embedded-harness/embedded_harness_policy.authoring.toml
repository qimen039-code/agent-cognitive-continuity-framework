[router_decision_contract.capability_discovery_contract]
enabled = true
schema = "cbh.capability_discovery_contract.v1"
router_skill = "capability-router"
meta_index_path = '../capability-router/registry.local/inventory/current.json'
registry_script = '../capability-router/scripts/capability_registry.py'
refresh_ttl_hours = 24
source_fingerprint_invalidation = true
miss_refresh_limit_per_query = 1
runtime_candidate_limit = 8
background_schedule = false
current_task_truth_required = true
rule = "CBH emits a semantic discovery requirement and compact intent signature only. The independent capability router resolves registered candidates, then the agent verifies current host exposure. CBH does not copy the registry, inject schemas, authenticate, call tools, or create permissions."

