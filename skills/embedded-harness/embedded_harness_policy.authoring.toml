[search_and_learning_decision_matrix.external_retrieval_contract.source_native_routes.npm]
anchor_types = ["package_id"]
provider_hints = ["npm"]
mode = "source_native_package_registry"
query_template = "{raw} npm"
direct_url_template = "https://www.npmjs.com/package/{raw_url}"
activation_condition = "immediate_when_registry_is_explicit"
authority_boundary = "npm is authoritative for package metadata published to npm; repository, security, and runtime behavior require their matching sources."

[search_and_learning_decision_matrix.external_retrieval_contract.source_native_routes.huggingface]
anchor_types = ["model_or_dataset_id"]
provider_hints = ["huggingface"]
mode = "source_native_model_or_dataset_registry"
query_template = "{raw}"
direct_url_template = "https://huggingface.co/{raw_url}"
activation_condition = "immediate_when_registry_is_explicit"
authority_boundary = "The Hugging Face repository or model card is primary for material published there; model capability and safety claims remain source claims until independently evaluated."

[search_and_learning_decision_matrix.external_retrieval_contract.source_native_routes.github_repository]
anchor_types = [
  "owner_repo_slug",
  "project_name",
  "namespaced_identifier",
]
provider_hints = [
  "github",
  "github_candidate",
]
mode = "github_open_source_repository_search"
query_template = "repo:{raw}"
direct_url_template = "https://github.com/{raw_url}"
activation_condition = "immediate_when_github_is_explicit_otherwise_only_after_source_capability_confirmation"
authority_boundary = "A GitHub repository can establish repository identity and its own code/docs/releases; it does not establish broader independent claims."

[search_and_learning_decision_matrix.external_retrieval_contract.source_native_routes.namespace_discovery]
anchor_types = ["namespaced_identifier"]
provider_hints = ["source_registry_unknown"]
mode = "source_native_capability_discovery"
query_template = "{quoted} official registry"
direct_url_template = ""
activation_condition = "immediate_for_unknown_namespace_before_provider_specific_url_construction"
authority_boundary = "This route identifies the owning registry or service. It cannot establish existence, ownership, or canonical URL until a matching source is opened."

[runtime_enforcement.behavior_correction_contract]
enabled = true
schema = "cbh.behavior_correction_contract.v1"
profile_registry_path = "behavior_correction_profiles.json"
profile_registry_schema = "cbh.behavior_correction_profile_registry.v1"
profile_registry_sha256 = "f43aeeb6ec6b1e68a89284fe4010bc869e576ea22ebbfa1de0cfe98a3e20d4f9"
registry_hash_algorithm = "sha256_raw_file_bytes"
profile_hash_algorithm = "sha256_canonical_json_profile"
profile_priority_rule = "descending_unique_integer_then_profile_id"
matcher_handler_allowlist = [
  "powershell_statement_loop_direct_pipeline",
  "powershell_interpolated_variable_colon",
  "bash_heredoc_in_powershell",
  "unquoted_bash_heredoc_in_powershell",
  "unicode_replacement_character_in_python_inline_write",
  "unicode_replacement_character_in_mutation",
]
binding_handler_allowlist = [
  "powershell_loop_pipeline_subject",
  "powershell_interpolated_variable_colon_subject",
  "python_inline_script_subject",
  "python_expanding_heredoc_transport_subject",
  "exact_mutation_target_subject",
]
related_handler_allowlist = [
  "powershell_statement_loop_related_command",
  "powershell_interpolated_variable_colon_related_command",
  "powershell_python_transport_related_command",
  "powershell_expanding_bash_transport_related_command",
  "same_target_python_inline_write",
  "same_target_mutation",
]
verifier_handler_allowlist = [
  "same_powershell_parser_zero_errors",
  "powershell_transport_pending_bash_syntax",
  "python_inline_payload_no_replacement_character_and_utf8_roundtrip",
  "input_unicode_no_replacement_character_and_utf8_roundtrip",
]
required_profile_fields = [
  "profile_id",
  "profile_version",
  "priority",
  "enforcement",
  "correction_family_id",
  "decision_mode",
  "promotion_status",
  "source_record_ids",
  "historical_replay_refs",
  "behavior_class",
  "environment",
  "trigger_stage",
  "match_kind",
  "binding_handler",
  "related_handler",
  "requires_parser_errors",
  "requires_exact_target_binding",
  "invalid_behavior",
  "content_goal",
  "target_binding",
  "rewrite_boundary",
  "rewrite_instruction",
  "allowed_constructions",
  "safe_template",
  "verifier",
  "verifier_channel",
  "verifier_instruction",
  "resolution_code",
  "evidence_boundary",
  "escalation_boundary",
  "source_kind",
  "source_ref",
  "postcondition",
]
capsule_schema = "cbh.execution_feedback_capsule.v1"
gate_receipt_schema = "cbh.behavior_correction_gate_receipt.v1"
binding_schema = "cbh.execution_subject_target_binding.v1"
binding_fields = [
  "subject_binding_sha256",
  "target_binding_sha256",
]
decision_modes = [
  "auto_rewrite",
  "preflight_validate",
  "predictive_review",
]
profile_enforcement_values = [
  "rewrite_current_event_nonblocking",
  "advisory_preflight_validate",
  "advisory_predictive_review",
]
current_candidate_binding = "profile_version_hash_plus_subject_target_candidate_sha256"
same_candidate_policy = "evaluate_once_per_unchanged_candidate"
verifier_contract = "profile_verifier_channel_plus_postcondition_plus_evidence_boundary"
registry_failure_behavior = "semantic_review_required_without_rewrite"
exact_target_unresolved_behavior = "semantic_review_required"
extension_mode = "versioned_registry_allowlisted_handlers_with_offline_promotion_only"
automatic_freeze = false
automatic_long_term_memory_write = false
automatic_policy_mutation = false
prohibited_auto_actions = [
  "session_freeze",
  "long_term_memory_write",
  "policy_mutation",
]
rule = "Behavior-correction profiles bind one unchanged current candidate to a source-linked correction family and exactly one decision mode. Only an accepted deterministic auto_rewrite profile can alter current native Bash input; validation and predictive-review profiles remain advisory. Outcomes require the declared verifier/postcondition and task-local retirement; promotion and durable memory updates remain offline explicit maintenance."

[runtime_enforcement.behavior_correction_contract.migration_hook]
enabled = true
schema = "cbh.behavior_correction_migration_hook.v1"
entrypoint = "behavior_correction_hook.py"
entrypoint_sha256 = "compiler_replaces_with_sha256_raw_file_bytes"
hash_algorithm = "sha256_raw_file_bytes"
hook_event = "PreToolUse"
tool_name_matcher = "^Bash$"
covered_host_tool_surface = "native_tool_name_Bash_only"
known_uncovered_tool_surfaces = [
  "nested_orchestration_dispatch_not_observed_as_host_Bash",
]
uncovered_surface_fallback = "one_direct_pretool_gate_call_only_when_the_selected_nested_dispatch_does_not_reach_the_host_Bash_hook_and_a_known_mechanical_recurrence_matches; no_match_or_ambiguity_is_noop"
output_contract = "allow_updated_input_only"
accepted_profile_enforcement = "rewrite_current_event_nonblocking"
rewrite_handler_allowlist = [
  "powershell_statement_loop_subexpression",
]
ambiguous_behavior = "no_output_original_input_unchanged"
host_blocking = false
stateful = false
automatic_memory_write = false
automatic_policy_mutation = false
rule = "Accepted deterministic profiles may transparently rewrite only the current native Bash tool input after exact binding and real-parser verification. Uncovered nested shell surfaces use at most one direct pretool advisory evaluation for a known recurrence and remain agent-owned. The hook and fallback never deny, persist state, write memory, mutate policy, or grant authority."

[runtime_enforcement.behavior_correction_contract.posttool_exact_readback]
required = false
required_for_verifier_channels = [
  "tool_input_and_exact_target_readback",
]
maximum_targets = 16
maximum_total_bytes = 4194304
encoding = "utf-8-sig-strict"
outcome_requirement = "no_failure_observed"
unavailable_behavior = "agent_reports_verification_debt"
