state_storage = "persistent_tasks_local_cumcwork_only"
authority_granted = false
rule = "CBH remains active. The persistent task-continuity layer sleeps by default. Use observe_once for a short write or single tool action so pre-action attention remains available without a cross-turn workfile. Arm persistent continuity only for a non-empty objective with a multi-step plan, explicit long-running/open-loop/continuation request, prior failure that must resume, or an existing active capsule. Track plan steps separately from acceptance evidence, continue from the earliest incomplete plan step, and retire only after the plan and required postconditions are complete or unresolved work is explicitly reported. Do not store chain-of-thought or create permission."

